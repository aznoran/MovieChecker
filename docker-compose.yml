services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - redis_data:/data
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USER}", "--pass", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
    command: migrate
    networks:
      - backend_network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,defaultDatabase=0,user=${REDIS_USER},Password=${REDIS_PASSWORD}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
      Authentik__Authority: https://auth.${APP_DOMAIN:-xui123qweqwe.org}/application/o/moviechecker/
      Authentik__MetadataUrl: http://authentik-server:9000/application/o/moviechecker/.well-known/openid-configuration
      Authentik__TokenEndpoint: http://authentik-server:9000/application/o/token/
      Authentik__UserInfoEndpoint: http://authentik-server:9000/application/o/userinfo/
      Authentik__ClientId: moviechecker
      Authentik__ClientSecret: ${AUTHENTIK_MOVIECHECKER_CLIENT_SECRET}
      Cors__Origins__0: https://xui123qweqwe.org
      Cors__Origins__1: http://xui123qweqwe.org
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - backend_network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://xui123qweqwe.org
        NEXT_PUBLIC_AUTHENTIK_URL: https://auth.${APP_DOMAIN:-xui123qweqwe.org}
        NEXT_PUBLIC_AUTHENTIK_CLIENT_ID: moviechecker
        NEXT_PUBLIC_AUTHENTIK_REDIRECT_URI: https://xui123qweqwe.org/auth/callback
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - backend_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs/letsencrypt:/etc/letsencrypt:ro
    networks:
      - backend_network
    depends_on:
      - backend
      - frontend
      - pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  backend_network:
    driver: bridge
