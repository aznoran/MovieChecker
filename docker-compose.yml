services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moviechecker}
      POSTGRES_USER: ${POSTGRES_USER:-moviechecker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviechecker_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moviechecker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-moviechecker};Username=${POSTGRES_USER:-moviechecker};Password=${POSTGRES_PASSWORD:-moviechecker_secret}"
      Jwt__Key: ${JWT_KEY:-MovieCheckerSuperSecretKey123456789012345678901234567890}
      Jwt__Issuer: MovieChecker
      Jwt__Audience: MovieChecker
      Cors__Origins__0: https://xui123qweqwe.org
      Cors__Origins__1: http://xui123qweqwe.org
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://xui123qweqwe.org/api  # Изменено на HTTPS
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - backend_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@xui123qweqwe.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_now}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - backend_network
    depends_on:
      - backend
      - frontend
      - pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  backend_network:
    driver: bridge