version: 1
metadata:
  name: MovieChecker OAuth2 Application
  labels:
    blueprints.goauthentik.io/description: "OAuth2 application for MovieChecker with Resource Owner Password flow"
entries:
  # ──────────────────────────────────────────────
  # 1. OAuth2 Provider (Resource Owner Password flow)
  #    References built-in scope mappings by scope_name — do NOT redefine them.
  # ──────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: moviechecker-provider
    identifiers:
      name: MovieChecker OAuth2 Provider
    attrs:
      name: MovieChecker OAuth2 Provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: moviechecker-client
      client_secret: moviechecker-client-secret-change-me
      include_claims_in_id_token: true
      access_token_validity: hours=1
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
      redirect_uris: |-
        http://localhost:3000/callback
        http://localhost:5000/callback

  # ──────────────────────────────────────────────
  # 2. Application
  # ──────────────────────────────────────────────
  - model: authentik_core.application
    id: moviechecker-app
    identifiers:
      slug: moviechecker
    attrs:
      name: MovieChecker
      slug: moviechecker
      provider: !KeyOf moviechecker-provider
      meta_launch_url: "http://localhost:3000"
      open_in_new_tab: false
