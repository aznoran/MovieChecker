version: 1
metadata:
  name: MovieChecker OAuth2 Application
  labels:
    blueprints.goauthentik.io/description: "OAuth2 application for MovieChecker with Resource Owner Password flow"
entries:
  # ──────────────────────────────────────────────
  # 1. Property Mappings (scopes)
  # ──────────────────────────────────────────────
  - model: authentik_providers_oauth2.scopemapping
    id: scope-openid
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-openid
    attrs:
      name: "OpenID"
      scope_name: openid
      expression: |
        return {
          "sub": request.user.uid,
        }

  - model: authentik_providers_oauth2.scopemapping
    id: scope-profile
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-profile
    attrs:
      name: "Profile"
      scope_name: profile
      expression: |
        return {
          "name": request.user.name,
          "given_name": request.user.name,
          "preferred_username": request.user.username,
          "nickname": request.user.username,
        }

  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-email
    attrs:
      name: "Email"
      scope_name: email
      expression: |
        return {
          "email": request.user.email,
          "email_verified": True,
        }

  # ──────────────────────────────────────────────
  # 2. OAuth2 Provider (Resource Owner Password flow)
  # ──────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: moviechecker-provider
    identifiers:
      name: MovieChecker OAuth2 Provider
    attrs:
      name: MovieChecker OAuth2 Provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: moviechecker-client
      client_secret: moviechecker-client-secret-change-me
      include_claims_in_id_token: true
      access_token_validity: hours=1
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      redirect_uris: |
        http://localhost:3000/callback
        http://localhost:5000/callback

  # ──────────────────────────────────────────────
  # 3. Application
  # ──────────────────────────────────────────────
  - model: authentik_core.application
    id: moviechecker-app
    identifiers:
      slug: moviechecker
    attrs:
      name: MovieChecker
      slug: moviechecker
      provider: !KeyOf moviechecker-provider
      meta_launch_url: "http://localhost:3000"
      open_in_new_tab: false
