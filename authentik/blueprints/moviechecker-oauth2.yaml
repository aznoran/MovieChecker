version: 1
metadata:
  name: MovieChecker Setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2 Provider for MovieChecker with Password Flow
  - model: authentik_providers_oauth2.oauth2provider
    id: moviechecker-provider
    state: present
    identifiers:
      name: MovieChecker Provider
    attrs:
      name: MovieChecker Provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: moviechecker
      client_secret: moviechecker-secret-change-me
      access_code_validity: minutes=1
      include_claims_in_id_token: true
      access_token_validity: minutes=60
      refresh_token_validity: days=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris: |-
        http://localhost:3000/auth/callback
        https://xui123qweqwe.org/auth/callback
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  # Application linked to the provider
  - model: authentik_core.application
    id: moviechecker-app
    state: present
    identifiers:
      slug: moviechecker
    attrs:
      name: MovieChecker
      provider: !KeyOf moviechecker-provider
      policy_engine_mode: any
      meta_launch_url: "blank://blank"

  # Create test users for local development only (DO NOT use in production)
  - model: authentik_core.user
    id: test-user
    state: present
    identifiers:
      username: testuser
    attrs:
      name: Test User
      email: testuser@moviechecker.local
      password: testpassword123
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, authentik Users]]

  - model: authentik_core.user
    id: test-admin
    state: present
    identifiers:
      username: testadmin
    attrs:
      name: Test Admin
      email: testadmin@moviechecker.local
      password: testpassword123
      is_active: true
      is_superuser: true
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]

