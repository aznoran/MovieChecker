version: 1
metadata:
  name: MovieChecker Setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ─── Task 4: Global role groups ──────────────────────────────────────────────
  - model: authentik_core.group
    id: group-participant
    identifiers: { name: moviechecker-participant }
    state: created
    attrs: {}

  - model: authentik_core.group
    id: group-moderator
    identifiers: { name: moviechecker-moderator }
    state: created
    attrs: {}

  - model: authentik_core.group
    id: group-administrator
    identifiers: { name: moviechecker-administrator }
    state: created
    attrs: {}

  # Assign bootstrap admin to administrator group
  - model: authentik_core.user
    identifiers: { username: akadmin }
    state: present
    attrs:
      groups:
        - !KeyOf group-administrator

  # Custom scope mapping — only includes moviechecker-* groups in token
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers: { scope_name: moviechecker-groups }
    state: present
    attrs:
      name: "MovieChecker Groups"
      description: MovieChecker role groups
      expression: |
        return {
            "groups": [g.name for g in request.user.ak_groups.all() if g.name.startswith("moviechecker-")]
        }

  # ─── Task 1: Custom logout flow ──────────────────────────────────────────────
  - model: authentik_stages_user_logout.userlogoutstage
    id: moviechecker-logout-stage
    identifiers: { name: moviechecker-logout-stage }
    state: present
    attrs: {}

  - model: authentik_flows.flow
    id: moviechecker-logout-flow
    identifiers: { slug: moviechecker-logout }
    state: present
    attrs:
      name: MovieChecker Logout
      title: Logout
      designation: invalidation
      authentication: require_authenticated
      layout: stacked
      policy_engine_mode: any

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf moviechecker-logout-flow
      stage: !KeyOf moviechecker-logout-stage
      order: 0
    state: present
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      invalid_response_action: retry
      policy_engine_mode: any

  # ─── Task 3: Self-service enrollment flow ────────────────────────────────────
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-username
    identifiers: { field_key: username }
    state: present
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Enter username
      order: 100
      translations:
        ru:
          label: Имя пользователя
          placeholder: Введите имя пользователя

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-email
    identifiers: { field_key: email }
    state: present
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Enter email address
      order: 101
      translations:
        ru:
          label: Электронная почта
          placeholder: Введите адрес почты

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-name
    identifiers: { field_key: name }
    state: present
    attrs:
      field_key: name
      label: Display name
      type: text
      required: true
      placeholder: How should we call you?
      order: 102
      translations:
        ru:
          label: Отображаемое имя
          placeholder: Как вас называть?

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password
    identifiers: { field_key: password }
    state: present
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Create a password
      order: 300
      translations:
        ru:
          label: Пароль
          placeholder: Придумайте пароль

  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password-repeat
    identifiers: { field_key: password_repeat }
    state: present
    attrs:
      field_key: password_repeat
      label: Repeat password
      type: password
      required: true
      placeholder: Repeat the password
      order: 301
      translations:
        ru:
          label: Повторите пароль
          placeholder: Повторите пароль

  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt-stage
    identifiers: { name: moviechecker-enrollment-prompt }
    state: present
    attrs:
      fields:
        - !KeyOf enrollment-field-username
        - !KeyOf enrollment-field-email
        - !KeyOf enrollment-field-name
        - !KeyOf enrollment-field-password
        - !KeyOf enrollment-field-password-repeat
      validation_policies:
        - !Find [
          authentik_policies_password.passwordpolicy,
          [name, default-password-change-password-policy],
        ]

  - model: authentik_stages_user_write.userwritestage
    id: enrollment-user-write
    identifiers: { name: moviechecker-enrollment-write }
    state: present
    attrs:
      user_creation_mode: always_create
      user_type: external
      create_users_group: !KeyOf group-participant

  - model: authentik_stages_user_login.userloginstage
    id: enrollment-user-login
    identifiers: { name: moviechecker-enrollment-login }
    state: present
    attrs: { session_duration: seconds=0 }

  - model: authentik_flows.flow
    id: enrollment-flow
    identifiers: { slug: moviechecker-enrollment }
    state: present
    attrs:
      name: MovieChecker Registration
      title: Create your account
      designation: enrollment
      authentication: require_unauthenticated
      layout: stacked
      policy_engine_mode: any

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf enrollment-flow, stage: !KeyOf enrollment-prompt-stage, order: 0 }
    state: present
    attrs: { evaluate_on_plan: true, re_evaluate_policies: false, invalid_response_action: retry, policy_engine_mode: any }

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf enrollment-flow, stage: !KeyOf enrollment-user-write, order: 10 }
    state: present
    attrs: { evaluate_on_plan: true, re_evaluate_policies: false, invalid_response_action: retry, policy_engine_mode: any }

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf enrollment-flow, stage: !KeyOf enrollment-user-login, order: 20 }
    state: present
    attrs: { evaluate_on_plan: true, re_evaluate_policies: false, invalid_response_action: retry, policy_engine_mode: any }

  # Link enrollment to the identification stage (adds "No account? Register" link)
  - model: authentik_stages_identification.identificationstage
    identifiers: { name: default-authentication-identification }
    state: present
    attrs:
      enrollment_flow: !KeyOf enrollment-flow
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: true
      user_fields:
        - email
        - username

  # ─── OAuth2 Provider ─────────────────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: moviechecker-provider
    state: present
    identifiers:
      name: MovieChecker Provider
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, platform-provider-logout]]
      client_type: confidential
      client_id: moviechecker
      client_secret: !Env AUTHENTIK_MOVIECHECKER_CLIENT_SECRET
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups
      redirect_uris:
        - url: "http://localhost:3000/api/auth/callback/authentik"
          matching_mode: strict
      sub_mode: user_uuid
      issuer_mode: per_provider
      logout_method: backchannel

  # Application linked to the provider
  - model: authentik_core.application
    id: moviechecker-app
    state: present
    identifiers:
      slug: moviechecker
    attrs:
      name: MovieChecker
      provider: !KeyOf moviechecker-provider
      policy_engine_mode: any
