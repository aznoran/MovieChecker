version: 1
metadata:
  name: MovieChecker Setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2 Provider for MovieChecker with Password Flow
  - model: authentik_providers_oauth2.oauth2provider
    id: moviechecker-provider
    state: present
    identifiers:
      name: MovieChecker Provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: moviechecker
      client_secret: moviechecker-secret-change-me
      access_code_validity: minutes=1
      access_token_validity: minutes=60
      refresh_token_validity: days=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # No redirect URIs needed for password flow
      redirect_uris: []
      sub_mode: hashed_user_id
      # Enable password grant type
      include_claims_in_id_token: true
      issuer_mode: per_provider

  # Application linked to the provider
  - model: authentik_core.application
    id: moviechecker-app
    state: present
    identifiers:
      slug: moviechecker
    attrs:
      name: MovieChecker
      provider: !KeyOf moviechecker-provider
      policy_engine_mode: any
      # Enable password authentication
      meta_launch_url: blank://blank

  # Brand for production domain (user-facing, styled to match MovieChecker)
  - model: authentik_brands.brand
    id: moviechecker-public-brand
    state: present
    identifiers:
      domain: xui123qweqwe.org
    attrs:
      branding_title: MovieChecker
      default: false
      flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

  # Brand for Docker internal hostname (fixes invalid_client when backend calls authentik-server:9000)
  - model: authentik_brands.brand
    id: moviechecker-internal-brand
    state: present
    identifiers:
      domain: authentik-server
    attrs:
      branding_title: MovieChecker (Internal)
      default: false
      flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]

  # Create a test user for development
  - model: authentik_core.user
    id: test-user
    state: present
    identifiers:
      username: testuser
    attrs:
      name: Test User
      email: testuser@moviechecker.local
      password: testpassword123
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, authentik Users]]
