version: 1
metadata:
  name: MovieChecker Setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OAuth2 Provider for MovieChecker
  - model: authentik_providers_oauth2.oauth2provider
    id: moviechecker-provider
    state: present
    identifiers:
      name: MovieChecker Provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: moviechecker
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: "https://xui123qweqwe.org/callback"
          matching_mode: strict
        - url: "https://xui123qweqwe.org/login"
          matching_mode: strict
      sub_mode: hashed_user_id

  # Application linked to the provider
  - model: authentik_core.application
    id: moviechecker-app
    state: present
    identifiers:
      slug: moviechecker
    attrs:
      name: MovieChecker
      provider: !KeyOf moviechecker-provider
      policy_engine_mode: any

  # Brand for production domain (user-facing, styled to match MovieChecker)
  - model: authentik_brands.brand
    id: moviechecker-public-brand
    state: present
    identifiers:
      domain: xui123qweqwe.org
    attrs:
      branding_title: MovieChecker
      default: false
      flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      branding_custom_css: |
        /* MovieChecker dark theme for Authentik */
        :root {
          --ak-dark-foreground: #fcfcfc;
          --ak-dark-background: #1f1f1f;
        }
        html, body {
          background: #1f1f1f !important;
        }
        .pf-c-login {
          background: #1f1f1f !important;
        }
        .pf-c-login__main {
          background: #333333 !important;
          border: 1px solid rgba(255,255,255,0.1) !important;
          border-radius: 12px !important;
          box-shadow: 0 4px 24px rgba(0,0,0,0.4) !important;
          max-width: 400px !important;
        }
        .pf-c-login__main-header,
        .pf-c-login__main-body,
        .pf-c-login__main-footer {
          color: #fcfcfc !important;
        }
        /* Primary button */
        .pf-c-button.pf-m-primary {
          background-color: #ebebeb !important;
          color: #1f1f1f !important;
          border: none !important;
          border-radius: 8px !important;
          font-weight: 600 !important;
        }
        .pf-c-button.pf-m-primary:hover {
          background-color: #d4d4d4 !important;
        }
        /* Input fields */
        .pf-c-form-control {
          background: #2a2a2a !important;
          border: 1px solid rgba(255,255,255,0.15) !important;
          border-radius: 8px !important;
          color: #fcfcfc !important;
        }
        .pf-c-form-control:focus {
          border-color: rgba(255,255,255,0.3) !important;
        }
        /* Labels */
        .pf-c-form__label-text {
          color: #b5b5b5 !important;
        }
        /* Links */
        .pf-c-login__main-footer-links a,
        .pf-c-button.pf-m-link {
          color: #b5b5b5 !important;
        }
        /* Hide default logo, show text */
        .pf-c-brand {
          display: none !important;
        }
        .pf-c-login__header::after {
          content: "MovieChecker";
          display: block;
          font-size: 1.75rem;
          font-weight: 700;
          color: #fcfcfc;
          text-align: center;
          margin-bottom: 0.5rem;
        }
        /* Title override */
        .pf-c-login__main-header .pf-c-title {
          color: #b5b5b5 !important;
          font-size: 0.95rem !important;
          font-weight: 400 !important;
        }
        /* Footer */
        .pf-c-login__footer {
          display: none !important;
        }
        /* Alerts */
        .pf-c-alert {
          background: #2a2a2a !important;
          border-radius: 8px !important;
        }
        .pf-c-alert__title {
          color: #fcfcfc !important;
        }

  # Brand for Docker internal hostname (fixes invalid_client when backend calls authentik-server:9000)
  - model: authentik_brands.brand
    id: moviechecker-internal-brand
    state: present
    identifiers:
      domain: authentik-server
    attrs:
      branding_title: MovieChecker (Internal)
      default: false
      flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
