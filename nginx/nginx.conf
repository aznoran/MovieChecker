http {
    # УДАЛИТЬ ВСЕ СТАТИЧЕСКИЕ upstream-БЛОКИ (backend, frontend, pgadmin)

    server {
        listen 80;
        server_name xui123qweqwe.org www.xui123qweqwe.org pgadmin.xui123qweqwe.org;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name xui123qweqwe.org www.xui123qweqwe.org;

        ssl_certificate /etc/letsencrypt/live/xui123qweqwe.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xui123qweqwe.org/privkey.pem;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api {
            resolver 127.0.0.11 valid=10s;  # Встроенный DNS Docker
            resolver_timeout 5s;
            set $upstream_backend backend:5000;
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            resolver 127.0.0.11 valid=10s;
            resolver_timeout 5s;
            set $upstream_frontend frontend:3000;
            proxy_pass http://$upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        server_name pgadmin.xui123qweqwe.org;

        ssl_certificate /etc/letsencrypt/live/xui123qweqwe.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xui123qweqwe.org/privkey.pem;

        location / {
            resolver 127.0.0.11 valid=10s;
            resolver_timeout 5s;
            set $upstream_pgadmin pgadmin:80;
            proxy_pass http://$upstream_pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}