events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket upgrade support (for Authentik)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Динамическое разрешение имён через встроенный DNS Docker
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name xui123qweqwe.org www.xui123qweqwe.org pgadmin.xui123qweqwe.org auth.xui123qweqwe.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name xui123qweqwe.org www.xui123qweqwe.org;

        ssl_certificate /etc/letsencrypt/live/xui123qweqwe.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xui123qweqwe.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api {
            resolver_timeout 5s;
            set $backend backend:5000;
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            resolver_timeout 5s;
            set $frontend frontend:3000;
            proxy_pass http://$frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name pgadmin.xui123qweqwe.org;

        ssl_certificate /etc/letsencrypt/live/xui123qweqwe.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xui123qweqwe.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            resolver_timeout 5s;
            set $pgadmin pgadmin:80;
            proxy_pass http://$pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name auth.xui123qweqwe.org;

        ssl_certificate /etc/letsencrypt/live/xui123qweqwe.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xui123qweqwe.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            resolver_timeout 5s;
            set $authentik authentik-server:9000;
            proxy_pass http://$authentik;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_buffering off;
        }
    }
}