# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: MovieChecker Branding
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: >-
      Cinema dark theme for MovieChecker login/registration pages.
      Locale is auto-detected from the browser (supports ru + en).
entries:
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    state: present
    attrs:
      default: true
      branding_title: "MovieChecker"
      # Use Authentik's own bundled assets — data URIs are not supported
      branding_favicon: /static/dist/assets/icons/icon.png
      branding_default_flow_background: /static/dist/assets/images/flow_background.jpg
      # Locale is intentionally left empty so the browser language is used.
      # Authentik ships built-in ru + en translations for all standard UI strings.
      # Custom prompt labels are translated via the `translations` field in
      # moviechecker-oauth2.yaml.
      attributes:
        settings:
          locale: ""
          theme:
            base: automatic
      flow_authentication:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation:
        !Find [authentik_flows.flow, [slug, platform-provider-logout]]
      flow_user_settings:
        !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      branding_custom_css: |
        /* ════════════════════════════════════════════════════════════════
           MovieChecker — Cinema Dark Theme (rewritten from scratch)

           Key insight: authentik uses Shadow DOM for stage components.
           Direct class selectors (.pf-c-form__label-text etc.) do NOT
           penetrate shadow boundaries. We must override via:
           1. CSS custom properties (inherit through shadow DOM)
           2. Broad selectors on light-DOM elements
           3. The * selector for color forcing where needed
           ════════════════════════════════════════════════════════════════ */

        /* ── 1. PatternFly & authentik CSS custom properties ──────────
           These cascade INTO shadow DOM and are the primary theming
           mechanism. Override all PF4 color tokens globally. ───────── */
        :root,
        .pf-c-login,
        .pf-c-login * {
          --pf-global--Color--100: #ffffff !important;
          --pf-global--Color--200: rgba(255, 255, 255, 0.85) !important;
          --pf-global--Color--light-100: #ffffff !important;
          --pf-global--Color--light-200: rgba(255, 255, 255, 0.85) !important;
          --pf-global--Color--dark-100: #ffffff !important;
          --pf-global--BackgroundColor--100: #0a0a0a !important;
          --pf-global--BackgroundColor--200: #000000 !important;
          --pf-global--BackgroundColor--dark-100: #000000 !important;
          --pf-global--BorderColor--100: rgba(255, 255, 255, 0.1) !important;
          --pf-global--BorderColor--200: rgba(255, 255, 255, 0.1) !important;
          --pf-global--primary-color--100: #ffffff !important;
          --pf-global--primary-color--200: rgba(255, 255, 255, 0.85) !important;
          --pf-global--link--Color: #ffffff !important;
          --pf-global--link--Color--hover: rgba(255, 255, 255, 0.75) !important;
          --pf-global--link--Color--visited: #ffffff !important;
          --pf-c-login__main-header--c-title--Color: #ffffff !important;
          --pf-c-title--m-3xl--Color: #ffffff !important;
          --pf-c-title--m-xl--Color: #ffffff !important;
          --pf-c-form__label--Color: #ffffff !important;
          --pf-c-form__label-text--Color: #ffffff !important;
          --pf-c-form-control--Color: #ffffff !important;
          --pf-c-form-control--BackgroundColor: rgba(255, 255, 255, 0.04) !important;
          --pf-c-form-control--BorderBottomColor: rgba(255, 255, 255, 0.2) !important;
          --pf-c-form-control--focus--BorderBottomColor: #ffffff !important;
          --pf-c-button--m-primary--BackgroundColor: #ffffff !important;
          --pf-c-button--m-primary--Color: #000000 !important;
          --pf-c-button--m-primary--hover--BackgroundColor: rgba(255, 255, 255, 0.85) !important;
          --pf-c-button--m-primary--hover--Color: #000000 !important;
          --pf-c-button--m-primary--active--BackgroundColor: rgba(255, 255, 255, 0.9) !important;
          --pf-c-button--m-primary--active--Color: #000000 !important;
          --pf-c-button--m-link--Color: #ffffff !important;
          --pf-c-button--m-link--hover--Color: rgba(255, 255, 255, 0.75) !important;
          --pf-c-login--BackgroundColor: #000000 !important;
          --pf-c-login__main--BackgroundColor: #0a0a0a !important;
          --ak-dark-foreground: #ffffff !important;
          --ak-dark-foreground-link: #ffffff !important;
          --ak-dark-background: #000000 !important;
          --ak-dark-background-light: #0a0a0a !important;
          --ak-dark-background-light-ish: #111111 !important;
          --ak-dark-background-lighter: #1a1a1a !important;
          color: #ffffff !important;
        }

        /* ── 2. Page background ───────────────────────────────────────── */
        .pf-c-login {
          background: #000000 !important;
        }

        /* ── 3. Flow card ─────────────────────────────────────────────── */
        .pf-c-login__main {
          background-color: #0a0a0a !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
          border-radius: 16px !important;
          box-shadow:
            0 32px 80px rgba(0, 0, 0, 0.8),
            0  0   0  1px rgba(255, 255, 255, 0.06) !important;
        }

        /* ── 4. Logo: hide img, replace with text ─────────────────────── */
        img.branding-logo {
          display: none !important;
        }

        .pf-c-brand {
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          min-height: 52px;
        }

        .pf-c-brand::after {
          content: "MovieChecker";
          font-family: Inter, system-ui, -apple-system, sans-serif;
          font-size: 1.9rem;
          font-weight: 700;
          color: #ffffff;
          letter-spacing: -0.03em;
        }

        /* ── 5. Force ALL text white inside login pages ───────────────
           This is the nuclear option that catches everything inside
           shadow DOM that CSS custom properties might miss. ────────── */
        .pf-c-login,
        .pf-c-login *,
        .pf-c-login__main *,
        .pf-c-login__main-header *,
        .pf-c-login__main-body *,
        .pf-c-login__main-footer *,
        .pf-c-login__main-footer-band * {
          color: #ffffff !important;
        }

        /* ── 6. Card header title (light DOM) ─────────────────────────── */
        .pf-c-login__main-header .pf-c-title,
        .pf-c-login__main-header h1,
        .pf-c-title.pf-m-3xl {
          font-size: 1.15rem !important;
          font-weight: 500 !important;
          color: #ffffff !important;
        }

        /* Hide the "Sign in to continue to …" subtitle */
        .pf-c-login__main-header-desc {
          display: none !important;
        }

        /* ── 7. Form labels (force via CSS vars + direct) ─────────────── */
        .pf-c-form__label,
        .pf-c-form__label-text,
        label {
          color: #ffffff !important;
        }

        /* ── 8. Username display text ─────────────────────────────────── */
        .username,
        [class*="username"],
        .pf-c-login .username,
        .pf-c-description-list__text,
        .pf-c-description-list dd {
          color: #ffffff !important;
        }

        /* ── 9. Form inputs ───────────────────────────────────────────── */
        .pf-c-form-control,
        .pf-c-login .pf-c-form-control,
        input[type="text"],
        input[type="password"],
        input[type="email"] {
          background-color: rgba(255, 255, 255, 0.04) !important;
          border-color: rgba(255, 255, 255, 0.1) !important;
          color: #ffffff !important;
          border-radius: 9px !important;
        }

        .pf-c-form-control:focus,
        .pf-c-login .pf-c-form-control:focus {
          border-color: #ffffff !important;
          box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12) !important;
          outline: none !important;
        }

        .pf-c-form-control::placeholder {
          color: rgba(255, 255, 255, 0.22) !important;
        }

        /* ── 10. Primary button — white bg, black text ────────────────── */
        .pf-c-button.pf-m-primary {
          border-radius: 9px !important;
          background-color: #ffffff !important;
          border-color: #ffffff !important;
          color: #000000 !important;
          font-weight: 600 !important;
          letter-spacing: 0.02em !important;
          transition: background-color 0.15s, transform 0.12s, box-shadow 0.15s !important;
        }

        .pf-c-button.pf-m-primary:hover {
          background-color: rgba(255, 255, 255, 0.85) !important;
          border-color: rgba(255, 255, 255, 0.85) !important;
          color: #000000 !important;
          transform: translateY(-1px) !important;
          box-shadow: 0 6px 24px rgba(255, 255, 255, 0.2) !important;
        }

        .pf-c-button.pf-m-primary:active {
          color: #000000 !important;
          transform: translateY(0) !important;
          box-shadow: none !important;
        }

        .pf-c-button.pf-m-primary .pf-c-spinner__path {
          stroke: #000000 !important;
        }

        /* ── 11. Link buttons & anchors ───────────────────────────────── */
        .pf-c-button.pf-m-link,
        .pf-c-button.pf-m-plain {
          color: #ffffff !important;
        }

        .pf-c-button.pf-m-link:hover {
          color: rgba(255, 255, 255, 0.75) !important;
        }

        a, a:visited {
          color: #ffffff !important;
        }

        a:hover {
          color: rgba(255, 255, 255, 0.75) !important;
        }

        /* ── 12. Footer band (registration link) ─────────────────────── */
        .pf-c-login__main-footer-band,
        .pf-c-login__main-footer-band-item,
        .pf-c-login__main-footer-band-item a {
          color: #ffffff !important;
        }

        /* ── 13. Footer links ─────────────────────────────────────────── */
        .pf-c-list.pf-m-inline li,
        .pf-c-list.pf-m-inline li a {
          color: rgba(255, 255, 255, 0.48) !important;
          font-size: 0.875rem;
          transition: color 0.15s;
        }

        .pf-c-list.pf-m-inline li:hover,
        .pf-c-list.pf-m-inline li:hover a {
          color: #ffffff !important;
        }

        /* ── 14. Alerts ───────────────────────────────────────────────── */
        .pf-c-alert.pf-m-danger {
          background: rgba(224, 82, 96, 0.1) !important;
          border-color: rgba(224, 82, 96, 0.28) !important;
          border-radius: 9px !important;
        }

        .pf-c-alert.pf-m-success {
          background: rgba(76, 175, 130, 0.1) !important;
          border-color: rgba(76, 175, 130, 0.28) !important;
          border-radius: 9px !important;
        }

        /* ── 15. Hide the flow debug inspector ────────────────────────── */
        ak-flow-inspector,
        #flow-inspector,
        .inspector-toggle,
        .pf-c-page__header-tools {
          display: none !important;
        }

        /* ── 16. Spinner ──────────────────────────────────────────────── */
        .pf-c-spinner__path {
          stroke: #ffffff !important;
        }

        /* ── 17. Scrollbar ────────────────────────────────────────────── */
        .pf-c-login {
          scrollbar-width: thin;
          scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }
        .pf-c-login::-webkit-scrollbar { width: 5px; }
        .pf-c-login::-webkit-scrollbar-track { background: transparent; }
        .pf-c-login::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.2);
          border-radius: 3px;
        }

        /* ── 18. Locale / language selector ───────────────────────────── */
        ak-locale-select select option:not([value=""]):not([value="en"]):not([value="ru"]) {
          display: none !important;
        }

        ak-locale-select .pf-c-select__menu-item:not([data-locale="en"]):not([data-locale="ru"]):not([data-locale=""]),
        ak-locale-select li:not([lang="en"]):not([lang="ru"]):not(:first-child) {
          display: none !important;
        }

        ak-locale-select select,
        select[name="locale"] {
          background-color: #111111 !important;
          background-image: none !important;
          color: #ffffff !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          border-radius: 8px !important;
          padding: 0.3rem 2rem 0.3rem 0.65rem !important;
          -webkit-appearance: none !important;
          appearance: none !important;
          cursor: pointer;
        }

        ak-locale-select select:focus,
        select[name="locale"]:focus {
          border-color: #ffffff !important;
          box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12) !important;
          outline: none !important;
        }

        ak-locale-select select option {
          background-color: #111111 !important;
          color: #ffffff !important;
        }

        ak-locale-select .pf-c-select__toggle {
          background-color: #111111 !important;
          color: #ffffff !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          border-radius: 8px !important;
        }

        ak-locale-select .pf-c-select__toggle:hover {
          background-color: rgba(255, 255, 255, 0.07) !important;
        }

        ak-locale-select .pf-c-select__toggle::before {
          border-color: rgba(255, 255, 255, 0.15) !important;
        }

        ak-locale-select .pf-c-select__toggle-arrow {
          color: rgba(255, 255, 255, 0.5) !important;
        }

        ak-locale-select .pf-c-select__menu {
          background-color: #111111 !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          border-radius: 9px !important;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7) !important;
        }

        ak-locale-select .pf-c-select__menu-item {
          background-color: transparent !important;
          color: #ffffff !important;
        }

        ak-locale-select .pf-c-select__menu-item:hover,
        ak-locale-select .pf-c-select__menu-item:focus {
          background-color: rgba(255, 255, 255, 0.08) !important;
          color: #ffffff !important;
        }

        ak-locale-select .pf-c-select__menu-item.pf-m-selected {
          color: #ffffff !important;
        }
